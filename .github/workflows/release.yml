name: release

# Builds, signs (when a certificate is configured), packs, and uploads a release with tools/release.ps1.
# Note: GitHub Actions does not start on this account at the moment (billing), so this workflow is untested;
# tools/release.ps1 run locally is the verified path (see docs/updates.md).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (SemVer, e.g. 0.4.1)
        required: true
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create the GitHub release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --solution RemoteManager.slnx --configuration Release

      # Optional signing: secret SIGN_PFX_BASE64 (the .pfx, base64) and SIGN_PFX_PASSWORD. Without them the build
      # is unsigned and the log says so.
      - name: Signing certificate
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
        run: |
          if ($env:SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            "RM_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
          }

      - name: Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RM_SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
          # Through the environment, not pasted into the script.
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'push') { $env:TAG_NAME.TrimStart('v') } else { $env:INPUT_VERSION }
          tools/release.ps1 -Version $version -UploadGitHub

      - name: Remove certificate file
        if: always()
        shell: pwsh
        run: if ($env:RM_SIGN_PFX) { Remove-Item $env:RM_SIGN_PFX -ErrorAction SilentlyContinue }
